<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" fill="none">
  <!-- Medical cross icon -->
  <rect x="8" y="20" width="36" height="10" rx="3" fill="#2563EB"/>
  <rect x="17" y="11" width="10" height="28" rx="3" fill="#2563EB"/>

  <!-- Stethoscope curve hint -->
  <path d="M34 36 Q44 44 44 30" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="44" cy="27" r="3" fill="#2563EB"/>

  <!-- JARVIS text -->
  <text x="56" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#2563EB" letter-spacing="2">JARVIS</text>

  <!-- Tagline -->
  <text x="57" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="400" fill="#60A5FA" letter-spacing="1.5">HEALTHCARE</text>
</svg>
